[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kanban"
version = "1.0.0"
description = "Lightweight Kanban board for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "2D-Soft", email = "dev@2d-soft.com"}
]
keywords = ["hermes", "kanban", "ai", "agent", "task-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "flask>=3.0,<4",
    "flask-cors>=4.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
hermes-kanban = "hermes_kanban.server:main"

[project.urls]
Homepage = "https://github.com/2D-Soft/hermes-kanban"
Repository = "https://github.com/2D-Soft/hermes-kanban"
Issues = "https://github.com/2D-Soft/hermes-kanban/issues"

[tool.setuptools.packages.find]
include = ["hermes_kanban*"]

[tool.setuptools.package-data]
hermes_kanban = ["../static/**/*"]
